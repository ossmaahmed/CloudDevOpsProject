apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roadmap-service-allow-ingress-from-frontend
  namespace: ivolve
spec:
  podSelector:
    matchLabels:
      app: roadmap-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
